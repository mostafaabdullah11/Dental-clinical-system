# Main pipeline (DEPLOYMENT_ARCHITECTURE.md §2.3, §2.4): re-run every PR check, build the four images ONCE, tag them with
# the commit SHA, push to GHCR, record digests, Trivy + SBOM, keyless cosign signature, then deploy the exact digests to
# staging (only when the staging environment is configured). Production never rebuilds: see deploy-production.yml.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions: { contents: read, security-events: write }

  images:
    needs: checks
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write, id-token: write }
    strategy:
      matrix: { image: [web, backend, migrator, backup] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.image }}
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/clinic-${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: image reference by digest
        id: ref
        run: echo "ref=ghcr.io/${{ github.repository_owner }}/clinic-${{ matrix.image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "${{ steps.ref.outputs.ref }}", severity: CRITICAL, ignore-unfixed: true, exit-code: "1" }
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with: { image: "${{ steps.ref.outputs.ref }}", format: spdx-json, artifact-name: "sbom-${{ matrix.image }}-${{ github.sha }}.spdx.json" }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: keyless signature (verified by deploy.sh when COSIGN_IDENTITY_REGEXP is set)
        run: cosign sign --yes "${{ steps.ref.outputs.ref }}"
      - name: record digest
        run: |
          mkdir -p digests && echo "${{ steps.ref.outputs.ref }}" > "digests/${{ matrix.image }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "digest-${{ matrix.image }}", path: digests/, retention-days: 400 }

  deploy-staging:
    needs: images
    if: vars.STAGING_HOST != ''
    runs-on: ubuntu-24.04
    environment: staging
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    permissions: { contents: read }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: "digest-*", merge-multiple: true, path: digests }
      - name: deploy exact digests over the forced-command SSH key
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes "deploy@${{ vars.STAGING_HOST }}" \
            "web=$(cat digests/web) backend=$(cat digests/backend) migrator=$(cat digests/migrator) backup=$(cat digests/backup)"
