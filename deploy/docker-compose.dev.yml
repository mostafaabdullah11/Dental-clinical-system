# Development only (DEPLOYMENT_ARCHITECTURE.md §1.6): a PostgreSQL container with the same roles as
# production, bootstrapped by the same script. Values come from ../.env (copy ../.env.example; never commit .env).
#
#   docker compose -f deploy/docker-compose.dev.yml --env-file .env up -d
#   dotnet ef database update --project src/Clinic.Persistence   (with CLINIC_MIGRATOR_CONNECTION set)
#   dotnet run --project src/Clinic.Api                            (with ConnectionStrings__Clinic set)
#   dotnet run --project src/Clinic.Api -- create-initial-manager <username>
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      CLINIC_MIGRATOR_PASSWORD: ${CLINIC_MIGRATOR_PASSWORD:?set in .env}
      CLINIC_APP_PASSWORD: ${CLINIC_APP_PASSWORD:?set in .env}
      CLINIC_WORKER_PASSWORD: ${CLINIC_WORKER_PASSWORD:?set in .env}
      CLINIC_BACKUP_PASSWORD: ${CLINIC_BACKUP_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - clinic_pg_data:/var/lib/postgresql
      - ./db:/clinic-db:ro
      - ./db/init-dev.sh:/docker-entrypoint-initdb.d/10-init-dev.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

volumes:
  clinic_pg_data: {}
