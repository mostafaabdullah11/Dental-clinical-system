# Local production-like validation (F5.21), layered on the production file. Synthetic data only; secrets generated by
# deploy/local/generate-secrets.sh into deploy/local/secrets (gitignored). Run everything with deploy/local/run-compose-smoke.sh:
#   docker compose -f deploy/compose/docker-compose.prod.yml -f deploy/compose/docker-compose.local.yml \
#     --env-file deploy/local/.env up -d --build
# Differences from production (and nothing else): images are built locally; PostgreSQL runs in a container bootstrapped with
# the SAME deploy/db/bootstrap-roles.sql; ports bind to 127.0.0.1:8080/8443; Caddy uses its internal CA for `localhost`.
services:
  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    networks: [internal]
    env_file: ["../local/.env"]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets: [postgres_admin_password]
    volumes:
      - ../db:/clinic-db:ro
      - ../db/init-dev.sh:/docker-entrypoint-initdb.d/10-init-dev.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinic"]
      interval: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  web:
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile.web }
    ports: !override ["127.0.0.1:8080:80", "127.0.0.1:8443:443"]

  api:
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile.backend }
    depends_on: { postgres: { condition: service_healthy } }

  worker:
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile.backend }
    depends_on: { postgres: { condition: service_healthy } }

  migrator:
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile.migrator }
    depends_on: { postgres: { condition: service_healthy } }

  backup:
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile.backup }
    depends_on: { postgres: { condition: service_healthy } }

secrets:
  postgres_admin_password: { file: "../local/secrets/postgres_admin_password" }
